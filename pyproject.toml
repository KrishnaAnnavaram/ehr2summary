[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr2summary"
version = "0.1.0"
description = "Generate discharge summaries from EHR codes and grade them with LLM-as-a-judge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40", "accelerate>=0.30"]
bertscore = ["bert-score>=0.3.13"]
all = ["ehr2summary[hf,bertscore]"]
dev = ["pytest>=8"]

[project.scripts]
ehr2summary = "ehr2summary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
